- id: cfnrain-format
  name: cfnrain format
  description: Format AWS CloudFormation templates
  entry: cfnrain
  language: golang
  files: \.(yml|yaml|json)$
  args: ["fmt", "-w"]

- id: cfnrain-verify
  name: cfnrain verify
  description: Verify AWS CloudFormation templates formatting without modifying files
  entry: cfnrain
  language: golang
  files: \.(yml|yaml|json)$
  args: ["fmt", "-v"]

# The old rain hook ids, kept so existing configs only change the repo URL
