Modules:
  M:
    Source: ./sequence-output-module.yaml
    Properties:
      Name: example
Resources:
  Example:
    Type: Custom::Example
    Properties:
      Direct: !GetAtt M.Out
      Nested: !Sub '${M.Out}-x'
      WithMap: !Sub ['${M.Out}-${Local}', {Local: suffix}]
      Collision: !Sub ['${M.Out}-${RainOutputM_Out}-${RainOutputM_Out1}', {RainOutputM_Out: parent}]
      ModuleCollision: !Sub '${M.Collision}-x'
      Shadowed: !Sub ['${M.Out}', {'M.Out': parent}]
      ScalarDirect: !GetAtt M.Scalar
      ScalarNested: !Sub '${M.Scalar}-x'
