Parameters:
  ListParam:
    Type: CommaDelimitedList

Resources:
  ZonesBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Selected
          Value: !Select
            - 0
            - !GetAZs
        - Key: SelectedLong
          Value: !Select
            - 0
            - !GetAZs

  ReferencesBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Selected
          Value: !Select
            - 0
            - !Ref ListParam
        - Key: SelectedLong
          Value: !Select
            - 0
            - !Ref ListParam

