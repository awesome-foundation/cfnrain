on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  # A maintainer runs a reviewed commit, for example the head of a pull request from a fork
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to test (40 hex characters)
        required: true
      lab:
        description: Run the separate approval-required lab after its infrastructure is deployed
        type: boolean
        default: false
  # Pull requests from branches in this repository, after a maintainer adds the integ label
  pull_request:
    types: [labeled, synchronize]

name: Integration tests

env:
  GOFLAGS: "-buildvcs=false"
  # The commit to test: an immutable SHA, so an approval covers exactly this code
  TEST_SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}

permissions: {}

# No job restores or saves a cache. A manual run executes the given commit
# under main's workflow, so a cache it saved could reach trusted workflows.
cache-mode: none

jobs:
  # The checks that need no AWS account. Runs without credentials.
  offline:
    name: Offline checks
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'integ') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check the commit SHA
        run: '[[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit SHA: $TEST_SHA"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false

      # No cache: a manual run executes the given commit here before any
      # approval, under main's workflow, and must not write main's cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test tools
        env:
          STATICCHECK_VERSION: "2026.2.2"
          CFN_LINT_VERSION: 1.57.2
          CHECKOV_VERSION: 3.3.29
          PKL_VERSION: 0.32.1
          PKL_SHA256: 3180b62da95c0cad1d904e9bb6c5f4a8f9032413c21e53194bb91ff1ee5f3211
          GUARD_VERSION: 3.2.1
          GUARD_SHA256: 09c2b8cfd81d513374a8da89d4805dc55006a3da52bbf598e272022d4d198e94
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          pip install "cfn-lint==${CFN_LINT_VERSION}" "checkov==${CHECKOV_VERSION}"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/pkl" "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-linux-amd64"
          echo "${PKL_SHA256}  $HOME/.local/bin/pkl" | sha256sum -c -
          chmod +x "$HOME/.local/bin/pkl"
          curl -fsSL -o guard.tar.gz "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${GUARD_VERSION}/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz"
          echo "${GUARD_SHA256}  guard.tar.gz" | sha256sum -c -
          tar -xzf guard.tar.gz
          install -m 0755 cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard "$HOME/.local/bin/cfn-guard"
          rm -rf guard.tar.gz cfn-guard-v3-x86_64-ubuntu-latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: ./scripts/integ-offline.sh

  # Fast deployment and packaging cases use the original restricted account.
  aws:
    name: AWS tests
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'integ') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Code on main uses the trusted environment, which only main can enter.
    # Everything else waits for a maintainer to approve the run.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'aws-integration' || 'aws-integration-review' }}
    permissions:
      contents: read
      id-token: write
    # The test bucket has one fixed name, so only one AWS run at a time.
    concurrency:
      group: integ-aws
      cancel-in-progress: false
    # Fresh one-hour credentials per job. Reserve time for cleanup.
    timeout-minutes: 55
    steps:
      - name: Check the commit SHA
        run: '[[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit SHA: $TEST_SHA"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false

      # No cache: a cache can come from a run that had no review
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Go tools, one checksummed binary, and system Python standard library only.
      # No Python packages in the job that has credentials.
      - name: Install test tools
        env:
          STATICCHECK_VERSION: "2026.2.2"
          YQ_VERSION: v4.54.1
          PKL_VERSION: 0.32.1
          PKL_SHA256: 3180b62da95c0cad1d904e9bb6c5f4a8f9032413c21e53194bb91ff1ee5f3211
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/mikefarah/yq/v4@${YQ_VERSION}"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/pkl" "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-linux-amd64"
          echo "${PKL_SHA256}  $HOME/.local/bin/pkl" | sha256sum -c -
          chmod +x "$HOME/.local/bin/pkl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INTEG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_INTEG_REGION }}
          role-session-name: cfnrain-integ-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Run the AWS tests
        id: aws-tests
        timeout-minutes: 45
        env:
          INTEG_REDACT_ROLE: ${{ vars.AWS_INTEG_ROLE_ARN }}
          INTEG_BUCKET_NAME: ${{ vars.INTEG_BUCKET_NAME }}
          INTEG_OUT: integ-out
          INTEG_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          INTEG_SLOW: false
        run: ./scripts/integ-aws.sh

      # The script also traps EXIT and TERM. This step covers a cancelled or
      # timed-out test step if the runner still has time to run another step.
      - name: Clean up integration stacks
        if: always() && steps.aws-tests.outcome != 'skipped'
        env:
          INTEG_REDACT_ROLE: ${{ vars.AWS_INTEG_ROLE_ARN }}
          INTEG_BUCKET_NAME: ${{ vars.INTEG_BUCKET_NAME }}
          INTEG_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/integ-aws.sh --cleanup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packaged-templates
          path: |
            integ-out/*.yaml
            integ-out/*.txt
          retention-days: 7

      - name: Upload redacted integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics
          path: integ-out/logs/
          retention-days: 7

  # A queued main push can run between these jobs. Both use the same lock,
  # fresh credentials, run-specific names, and their own cleanup.
  aws-slow:
    name: Slow AWS tests
    needs: aws
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    # Code on main uses the trusted environment, which only main can enter.
    # Everything else waits for a maintainer to approve the run.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'aws-integration' || 'aws-integration-review' }}
    permissions:
      contents: read
      id-token: write
    # The test bucket has one fixed name, so only one AWS run at a time.
    concurrency:
      group: integ-aws
      cancel-in-progress: false
    # Fresh one-hour credentials per job. Reserve time for cleanup.
    timeout-minutes: 50
    steps:
      - name: Check the commit SHA
        run: '[[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit SHA: $TEST_SHA"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false

      # No cache: a cache can come from a run that had no review
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
        run: go install "github.com/mikefarah/yq/v4@${YQ_VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INTEG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_INTEG_REGION }}
          role-session-name: cfnrain-slow-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Run the slow AWS tests
        id: aws-tests
        timeout-minutes: 35
        env:
          INTEG_REDACT_ROLE: ${{ vars.AWS_INTEG_ROLE_ARN }}
          INTEG_BUCKET_NAME: ${{ vars.INTEG_BUCKET_NAME }}
          INTEG_OUT: integ-out
          INTEG_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          INTEG_SLOW: true
        run: ./scripts/integ-aws.sh --slow

      # The script also traps EXIT and TERM. This step covers a cancelled or
      # timed-out test step if the runner still has time to run another step.
      - name: Clean up integration stacks
        if: always() && steps.aws-tests.outcome != 'skipped'
        env:
          INTEG_REDACT_ROLE: ${{ vars.AWS_INTEG_ROLE_ARN }}
          INTEG_BUCKET_NAME: ${{ vars.INTEG_BUCKET_NAME }}
          INTEG_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/integ-aws.sh --cleanup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: slow-p1-evidence
          path: |
            integ-out/*.txt
            integ-out/logs/
          retention-days: 7

  # Bucket removal and service-role cases require the separately approved lab.
  p1-isolated:
    name: Optional isolated P1 cases
    if: github.event_name == 'workflow_dispatch' && inputs.lab
    runs-on: ubuntu-latest
    environment: aws-integration-lab-review
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: integ-p1-isolated
      cancel-in-progress: false
    timeout-minutes: 35
    env:
      INTEG_REDACT_ROLE: ${{ vars.AWS_INTEG_ROLE_ARN }}
      AWS_INTEG_ROLE_ARN: ${{ vars.AWS_INTEG_ROLE_ARN }}
      INTEG_BUCKET_NAME: ${{ vars.INTEG_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_INTEG_REGION }}
      INTEG_SERVICE_ROLE_ARN: ${{ vars.INTEG_SERVICE_ROLE_ARN }}
      INTEG_BOOTSTRAP_REGION: ${{ vars.INTEG_BOOTSTRAP_REGION }}
      INTEG_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check isolated prerequisites
        id: prerequisites
        run: |
          if [[ -z "$AWS_INTEG_ROLE_ARN" || -z "$AWS_REGION" || -z "$INTEG_BUCKET_NAME" || -z "$INTEG_SERVICE_ROLE_ARN" || -z "$INTEG_BOOTSTRAP_REGION" ]]; then
            echo 'SKIPPED: isolated cases need AWS_INTEG_ROLE_ARN, AWS_INTEG_REGION, INTEG_BUCKET_NAME, INTEG_SERVICE_ROLE_ARN, and INTEG_BOOTSTRAP_REGION'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the commit SHA
        if: steps.prerequisites.outputs.ready == 'true'
        run: '[[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.prerequisites.outputs.ready == 'true'
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.prerequisites.outputs.ready == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure isolated AWS credentials
        if: steps.prerequisites.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_INTEG_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cfnrain-p1-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Run isolated P1 cases
        id: isolated-tests
        timeout-minutes: 20
        if: steps.prerequisites.outputs.ready == 'true'
        run: ./scripts/integ-aws.sh --p1-isolated
      - name: Clean up isolated P1 cases
        if: always() && steps.isolated-tests.outcome != 'skipped' && steps.isolated-tests.outcome != ''
        run: ./scripts/integ-aws.sh --cleanup-lab

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.prerequisites.outputs.ready == 'true'
        with:
          name: isolated-p1-evidence
          path: |
            integ-out/*.txt
            integ-out/logs/
          retention-days: 7

  # Lints the templates that the AWS job packaged. Runs without credentials.
  lint-packaged:
    name: Lint packaged templates
    needs: aws
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-templates
          path: integ-out

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - env:
          CFN_LINT_VERSION: 1.57.2
        run: |
          pip install "cfn-lint==${CFN_LINT_VERSION}"
          cfn-lint integ-out/webapp.yaml integ-out/webapp-pkl.yaml
