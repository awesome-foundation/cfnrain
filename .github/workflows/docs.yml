name: Documentation

# Builds the site with Zensical. A push to main deploys it to GitHub Pages.
# A pull request with the docs-preview label publishes a preview under
# https://awesome-foundation.github.io/preview/cfnrain/pr-<number>/.
# Closing the pull request or removing the label removes it.

# Runs only when the site can change. The docs include example files
# from cft/pkg/tmpl/ through snippets.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "cft/pkg/tmpl/**"
      - "zensical.toml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
    paths:
      - "docs/**"
      - "cft/pkg/tmpl/**"
      - "zensical.toml"
      - "overrides/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

env:
  # Zensical is pre-1.0 and releases often. Update this on purpose.
  ZENSICAL_VERSION: "0.0.73"

jobs:
  build:
    # Other labels do not change the site
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
      (github.event.action == 'labeled' && github.event.label.name == 'docs-preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install "zensical==${ZENSICAL_VERSION}"
      # --strict fails the build on broken links, missing anchors and
      # missing example files
      - run: zensical build --clean --strict
      # Search Console often fails to fetch sitemap.xml from GitHub Pages.
      # sitemap.txt lists the same URLs, one per line, as a fallback.
      - name: Write sitemap.txt
        run: |
          sed -n 's|.*<loc>\(.*\)</loc>.*|\1|p' site/sitemap.xml > site/sitemap.txt
          test -s site/sitemap.txt
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: site
          retention-days: 1

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # Secrets do not reach pull requests from forks or from Dependabot, so
  # previews cover other branches in this repository only
  publish:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'docs-preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: awesome-foundation/preview/.github/workflows/publish.yml@c20e296d0888dfe418ef42dabb9e0664e7bc5ade # main as of 2026-10-26
    with:
      project: cfnrain
    secrets: inherit

  teardown:
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'docs-preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: awesome-foundation/preview/.github/workflows/teardown.yml@c20e296d0888dfe418ef42dabb9e0664e7bc5ade # main as of 2026-10-26
    with:
      project: cfnrain
    secrets: inherit
