on:
  push:
    branches:
      - main
  # Any base branch, so stacked PRs get tested too
  pull_request:
  # The release workflow dispatches this for release-please PRs (see release-please.yml)
  workflow_dispatch:

name: Unit tests

env:
  GOFLAGS: "-buildvcs=false"

permissions:
  contents: read

jobs:
  changeset-names:
    name: Integration change set names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/integ-changeset-test.py

  # Picks how much of the test job a pull request needs:
  #   skip  only files that the Go build and tests do not read
  #   docs  also docs/, which only TestEveryCommandIsDocumented reads
  #   full  anything else
  # A skipped job counts as passed for the required check, so the merge
  # gate stays. Pushes, dispatches and a failed changes job run in full.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      mode: ${{ steps.files.outputs.mode }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SKIP: '^[^/]+\.md$|^LICENSE|^NOTICE|^zensical\.toml$|^overrides/|^\.github/(dependabot\.yml|ISSUE_TEMPLATE/|workflows/(docs|release-please|security)\.yml)'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            -q '.[] | .filename, (.previous_filename // empty)' > files.txt
          if grep -vE "$SKIP" files.txt | grep -qv '^docs/'; then
            echo mode=full >> "$GITHUB_OUTPUT"
          elif grep -q '^docs/' files.txt; then
            echo mode=docs >> "$GITHUB_OUTPUT"
          else
            echo mode=skip >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    container: golang:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        if: needs.changes.outputs.mode != 'docs'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        if: needs.changes.outputs.mode != 'docs'
        run: |
          staticcheck ./...
          go vet ./...

      - name: Run unit tests
        if: needs.changes.outputs.mode != 'docs'
        run: go test ./...

      - name: Check packaging for data races
        if: needs.changes.outputs.mode != 'docs'
        run: go test -race ./cft/pkg ./internal/s11n

      - name: Check that docs/ names every command
        if: needs.changes.outputs.mode == 'docs'
        run: go test ./internal/cmd/rain -run TestEveryCommandIsDocumented

  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run emulator tests
        run: scripts/integ-emulator.sh
      - name: Save emulator output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-output
          path: emulator-logs/
          retention-days: 7
