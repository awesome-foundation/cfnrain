on:
  push:
    branches:
      - main
  # Any base branch, so stacked PRs get tested too
  pull_request:
  # The release workflow dispatches this for release-please PRs (see release-please.yml)
  workflow_dispatch:

name: Unit tests

env:
  GOFLAGS: "-buildvcs=false"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: golang:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        run: |
          staticcheck ./...
          go vet ./...

      - name: Run unit tests
        run: go test ./...
