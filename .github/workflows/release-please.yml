name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
      # release-please opens and updates its PR with GITHUB_TOKEN, and events from
      # that token do not trigger pull_request workflows. GITHUB_TOKEN may trigger
      # workflow_dispatch, so dispatch the required checks on the release branch.
      # Their results attach to the PR's head commit under the same check names.
      - name: Run checks on the release PR
        if: steps.release.outputs.releases_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main--components--cfnrain
        run: |
          if gh api "repos/${{ github.repository }}/branches/$BRANCH" --silent 2>/dev/null; then
            gh workflow run test.yml --repo "${{ github.repository }}" --ref "$BRANCH"
            gh workflow run security.yml --repo "${{ github.repository }}" --ref "$BRANCH"
          fi

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          # Four parallel cross-compiles with the embedded schemas ran the
          # runner out of memory, so build two targets at a time
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every archive listed in checksums.txt. Public
      # repositories only: attestations are public, and private repositories
      # need GitHub Enterprise for them.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: ./dist/checksums.txt
      # subject-checksums covers the files listed in checksums.txt, not the file itself
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ./dist/checksums.txt
      # Publish only now, with every asset attached: immutable releases lock on publish
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --repo "${{ github.repository }}" --draft=false
