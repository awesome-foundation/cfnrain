name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # The Homebrew tap is public. While this repository is private, a
          # release must not push a formula there.
          args: release --clean ${{ github.event.repository.private && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Build provenance for every archive listed in checksums.txt. Public
      # repositories only: attestations are public, and private repositories
      # need GitHub Enterprise for them.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: ./dist/checksums.txt
      # subject-checksums covers the files listed in checksums.txt, not the file itself
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ./dist/checksums.txt
