Description: B4 retained bucket removal
Parameters:
  BucketName:
    Type: String
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      Tags:
        - Key: cfnrain-integ-owner
          Value: !Ref BucketName
