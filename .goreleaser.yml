version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # modules.zip and modules.sha256, released as extra assets like upstream did
    - ./.github/workflows/modules.sh

builds:
  - id: cfnrain
    main: ./cmd/cfnrain
    binary: cfnrain
    env:
      # One build per platform. Upstream also shipped CGO variants, but
      # cross-compiling turns CGO off anyway, and only forecast --plugin needs it.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # The platform matrix rain v1.24.4 released
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm, "386"]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: cfnrain
    ids: [cfnrain]
    formats: [tar.gz]
    name_template: "cfnrain_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

brews:
  - repository:
      owner: awesome-foundation
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/awesome-foundation/cfnrain
    description: Command-line tool for AWS CloudFormation, a community fork of Rain
    license: Apache-2.0
    # homebrew-core's rain formula also installs a rain binary
    conflicts:
      - rain
    install: |
      bin.install "cfnrain"
      bin.install_symlink "cfnrain" => "rain"
    test: |
      system bin/"cfnrain", "--version"
      system bin/"rain", "--version"

release:
  github:
    owner: awesome-foundation
    name: cfnrain
  extra_files:
    - glob: ./dist/modules.zip
    - glob: ./dist/modules.sha256
