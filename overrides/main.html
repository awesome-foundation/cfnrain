{% extends "base.html" %}

{% block extrahead %}
  {#- Umami Cloud counts page views without cookies. The check skips PR
      previews, which live under /preview/cfnrain/ on the same host. -#}
  <script>
    if (location.pathname.indexOf("/cfnrain/") === 0) {
      var s = document.createElement("script");
      s.defer = true;
      s.src = "https://cloud.umami.is/script.js";
      s.dataset.websiteId = "8bbe0f08-5715-4f6c-bb83-95e8d5603698";
      s.dataset.excludeHash = "true";
      s.dataset.excludeSearch = "true";
      document.head.appendChild(s);
    }
  </script>
{% endblock %}
