# Documentation site for cfnrain, built with Zensical.
# CI pins the Zensical version in .github/workflows/docs.yml.
# Build locally from the repository root: zensical build --clean --strict

[project]
site_name = "cfnrain"
site_description = "A command line tool for AWS CloudFormation templates and stacks"
site_url = "https://awesome-foundation.github.io/cfnrain/"
repo_url = "https://github.com/awesome-foundation/cfnrain"
repo_name = "awesome-foundation/cfnrain"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

# The console federation issuer in internal/aws/console/console.go is
# https://awesome-foundation.github.io/cfnrain/cfnrain_console.html, so
# docs/cfnrain_console.md must stay, outside the nav. Directory URLs would
# move that page to cfnrain_console/, so keep them off.
use_directory_urls = false

nav = [
  { "Home" = "index.md" },
  { "Why CloudFormation and Rain" = "why.md" },
  { "Get started" = [
    { "Install" = "install.md" },
    { "Your first deploy" = "getting-started.md" },
    { "Migrating from rain" = "migrating.md" },
  ] },
  { "How it works" = [
    { "Deploying" = "concepts/deploying.md" },
    { "Packaging" = "concepts/packaging.md" },
    { "The artifact bucket" = "concepts/artifact-bucket.md" },
    { "Experimental features" = "concepts/experimental.md" },
  ] },
  { "Template language" = [
    { "Directives" = [
      "directives/index.md",
      { "Embed" = "directives/embed.md" },
      { "Include" = "directives/include.md" },
      { "Env" = "directives/env.md" },
      { "S3 and S3Http" = "directives/s3.md" },
      { "Implicit uploads" = "directives/implicit-uploads.md" },
    ] },
    { "Constants" = "constants.md" },
    { "Modules" = [
      "modules/index.md",
      { "Writing modules" = "modules/writing.md" },
      { "ForEach" = "modules/foreach.md" },
      { "IfParam and conditions" = "modules/conditions.md" },
      { "Intrinsic functions" = "modules/intrinsics.md" },
      { "Packages" = "modules/packages.md" },
    ] },
  ] },
  { "Guides" = [
    { "CI usage" = "ci.md" },
    { "Static sites with S3 bucket metadata" = "bucket-metadata.md" },
    { "Pkl" = "pkl.md" },
  ] },
  { "Command reference" = [
    { "Common flags" = "commands/common-flags.md" },
    { "Stack commands" = [
      "commands/stack/index.md",
      { "deploy" = "commands/stack/deploy.md" },
      { "ls" = "commands/stack/ls.md" },
      { "cat" = "commands/stack/cat.md" },
      { "logs" = "commands/stack/logs.md" },
      { "watch" = "commands/stack/watch.md" },
      { "rm" = "commands/stack/rm.md" },
      { "stackset" = "commands/stack/stackset.md" },
      { "cc" = "commands/stack/cc.md" },
    ] },
    { "Template commands" = [
      "commands/template/index.md",
      { "fmt" = "commands/template/fmt.md" },
      { "pkg" = "commands/template/pkg.md" },
      { "diff" = "commands/template/diff.md" },
      { "merge" = "commands/template/merge.md" },
      { "tree" = "commands/template/tree.md" },
      { "build" = "commands/template/build.md" },
      { "bootstrap" = "commands/template/bootstrap.md" },
      { "forecast" = "commands/template/forecast.md" },
      { "module" = "commands/template/module.md" },
    ] },
    { "Account commands" = [
      "commands/account/index.md",
      { "info" = "commands/account/info.md" },
      { "console" = "commands/account/console.md" },
    ] },
  ] },
  { "Project" = [
    { "Known issues" = "known-issues.md" },
  ] },
]

[project.theme]
language = "en"
# overrides/main.html adds the Umami page view counter.
custom_dir = "overrides"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true

# Pages include the tested example templates from cft/pkg/tmpl, so the
# base path is the repository root. check_paths fails the build when an
# included file is missing.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
